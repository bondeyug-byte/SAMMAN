ithout consent and on platform takedown duties. The exact sections and how they apply must be checked with a qualified lawyer; see the legal reference notes in the Learning Programme, which carry verification labels.","If this is happening to you or someone you know, the Support section lists services and their verification status."],keywords:["forward","image","photo","picture","edit","law","legal","illegal","deepfake","ai"]},{id:"q4",q:"What should I do if a friend tells me something happened and asks me not to tell anyone?",a:["Listen. Thank them. Tell them it isn’t their fault. Ask what would help. You don’t need details or proof, and you don’t need to decide what happened.","Be honest about what you can promise. If you hold a formal role (staff, office-bearer, peer counsellor), find out your duties before any such conversation. Different rules may apply if the person is under 18.","You can offer to find information about support, or go with them, if they want."],keywords:["friend","told","secret","disclose","disclosure","tell","support"]},{id:"q5",q:"How do I tell whether checking someone’s phone is care or control?",a:["Care respects the other person’s right to say no. Control makes saying no costly — through anger, sulking, accusations or threats.","One moment rarely describes a whole relationship. Patterns matter: limits on who someone sees, what they wear, or where they go, especially when explained as worry or love.","If this feels familiar, general support routes are listed in the Support section."],keywords:["phone","password","location","control","jealous","check","track"]},{id:"q6",q:"What does a college Internal Complaints Committee do?",a:["Indian higher-education institutions are expected to have a committee that handles complaints of sexual harassment, under UGC regulations. The details — who sits on it, how to contact it, timelines and confidentiality — are set by regulation and by each institution.","This prototype is not connected to any real institution. In a real deployment, the participating college would supply and verify this information. Status: verification pending."],keywords:["committee","icc","complaint","college","report","process"]},{id:"q7",q:"Does this apply if the person harmed is a man, or trans or non-binary?",a:["Yes. Respect for consent and boundaries applies to everyone, and anyone can be harmed. SAMMAN keeps violence against women central because of how commonly women are affected, without denying other people’s experiences.","Legal protections in India differ by gender in some areas. Anyone affected can seek support; for legal questions, a qualified lawyer should advise."],keywords:["man","male","boy","trans","non-binary","gender","lgbt","queer"]},{id:"q8",q:"Will completing SAMMAN show that someone is safe?",a:["No. Completing a programme does not certify that anyone is safe, and scenario answers do not predict behaviour. Published research finds education changes knowledge and attitudes more reliably than behaviour."],keywords:["certificate","safe","complete","prove","score","pass"]}],ct="October 2026",ug=[{id:"112",group:"urgent",name:"Emergency Response Support System (ERSS)",contact:[{label:"Emergency number",value:"112",dial:"112"}],operator:"Ministry of Home Affairs (national); Maharashtra Police (state system)",purpose:"Emergency number for immediate danger.",stated:"A Navi Mumbai Police page describes Dial 112 as the Maharashtra State Emergency Response System, live in that commissionerate since 4 September 2021.",notStated:"Hours, languages and confidentiality were not stated in the source that could be read.",source:[{label:"Navi Mumbai Police — Dial 112 page",url:"https://navimumbaipolice.gov.in/en/police/welfare/08cb7358-d23b-45c9-8a94-7c60b056501b"},{label:"Official national page (112.gov.in) — not reachable from the build environment"}],status:"Verification pending",statusNote:"Official national page not confirmed. The project’s official reference for 112 must be checke ,rel:"noreferrer",children:i.source}):i.source}),s.jsx("td",{children:i.population}),s.jsx("td",{children:i.limitation}),s.jsx("td",{children:i.implication}),s.jsx("td",{children:s.jsx(Ct,{status:i.status})})]},i.claim))})]})})]})]})}const Rd=[{id:"first-years",label:"First-year students",ages:"18–19",description:"New to college: orientation, hostels, seniors, group chats and new relationships.",available:!0,questions:[{id:"fy1",prompt:"At an orientation party, someone agreed to kiss earlier in the evening. Later they seem hesitant. What does the earlier agreement mean now?",options:[{id:"a",text:"It still counts, because they already said yes tonight."},{id:"b",text:"It doesn’t decide anything now. Hesitation means stop and check."},{id:"c",text:"It counts unless they clearly say “no”."}],correct:"b",explanation:"Consent is ongoing. An earlier yes describes that moment, not this one. Hesitation is a signal to pause and check — not to wait for a firm no.",hint:"Think about whether agreement can change during an evening.",topicId:"consent"},{id:"fy2",prompt:"A senior tells first-years in the hostel to rate female classmates’ looks in a group chat “as a tradition”. Which description fits best?",options:[{id:"a",text:"Harmless bonding that everyone goes through."},{id:"b",text:"Pressure from someone with power, asking juniors to take part in objectifying classmates."},{id:"c",text:"Only a problem if the classmates find out."}],correct:"b",explanation:"Seniority gives the request weight, and the activity reduces classmates to their appearance. The harm doesn’t depend on whether they find out. Seniors pressuring juniors may also fall under college anti-ragging rules (verification pending).",topicId:"power"},{id:"fy3",prompt:"An edited sexualised picture of a classmate appears in your class chat. What is the safest first step?",options:[{id:"a",text:"Forward it to a friend to ask whether it’s real."},{id:"b",text:"Don’t save or forward it; report it on the platform and, if safe, ask for it to be deleted."},{id:"c",text:"Ignore it — it’s probably AI, so it doesn’t matter."}],correct:"b",explanation:"Every forward makes another copy. Whether or not it is “real”, it uses a real person’s identity without consent. Reporting and asking for deletion limit spread without exposing her further.",topicId:"digital"},{id:"fy4",prompt:"Your friend has messaged someone twelve times after she said “please stop”. He asks you to help write something funny. What does her message mean?",options:[{id:"a",text:"She is testing how much he likes her."},{id:"b",text:"She wants him to wait a while and try again."},{id:"c",text:"She has asked him to stop; continuing is unwanted contact."}],correct:"c",explanation:"“Please stop” means stop. Treating it as a test or a delay overrides her answer. You can be kind to your friend and still decline to help.",topicId:"entitlement"},{id:"fy5",prompt:"Five older students are making comments about a junior’s clothes at the bus stop. You are alone. Which response is reasonable?",options:[{id:"a",text:"You must confront them directly, or you’re part of the problem."},{id:"b",text:"Create a distraction, such as asking her to walk with you, or get a guard — then check on her."},{id:"c",text:"Film it and post it so people know."}],correct:"b",explanation:"Physical confrontation is never required. Interrupting, getting help and checking in afterwards are safe, effective options. Posting a video can expose her without her consent.",topicId:"sexism"},{id:"fy6",prompt:"A new hostel friend tells you something unwanted happened at a party and asks you not to tell anyone. What should you avoid?",options:[{id:"a",text:"Asking lots of questions to work out exactly what happened."},{id:"b",text:"Thanking her for telling you and asking what would help."},{id:"c",text:"Being honest about what you can and can’t promise."}],correct:"a",explanation:"Support is not investigation. Detailed questioning can feel like being doubted. Listening, believing that it matters, and asking what would help are the core of a supportive response.",topicId:"support"},{id:"fy7",prompt:"Where should information about who handles sexual harassment concerns at college come from?",options:[{id:"a",text:"Senior students’ advice in WhatsApp groups."},{id:"b",text:"Official, current details published by the college, such as its Internal Complaints Committee."},{id:"c",text:"There is no need to know until something happens."}],correct:"b",explanation:"Institutions are expected to publish committee contacts and processes. Knowing in advance makes it easier to help yourself or a friend. If you can’t find the details, that is an institutional gap worth raising.",topicId:"institutions"},{id:"fy8",prompt:"Someone says, “If she didn’t want attention, she wouldn’t dress like that.” What is the accurate response?",options:[{id:"a",text:"Clothing doesn’t cause harassment; responsibility lies with the person who harasses."},{id:"b",text:"It depends on what she was wearing."},{id:"c",text:"Both sides have a point."}],correct:"a",explanation:"This is victim-blaming. Women should not have to restrict their lives to prevent someone else’s behaviour.",topicId:"sexism"}]},{id:"senior-students",label:"Students",ages:"20–22",description:"Relationships, internships, leadership roles, and supporting friends.",available:!0,questions:[{id:"ss1",prompt:"A couple has been together for a year. One partner says “not tonight”. Which response respects that?",options:[{id:"a",text:"“Why? We’ve done this before.”"},{id:"b",text:"“Okay.” — and no sulking afterwards."},{id:"c",text:"“Fine,” and then going quiet for the rest of the evening."}],correct:"b",explanation:"A relationship doesn’t create permission. Asking for reasons or going cold makes saying no costly — a form of pressure. “Okay” is a complete response.",topicId:"consent"},{id:"ss2",prompt:"A manager says, “Let’s discuss your job offer over dinner — just us, keep it between us.” What makes this concerning?",options:[{id:"a",text:"Nothing; managers often have dinner with interns."},{id:"b",text:"He controls her offer, and is mixing it with personal attention and secrecy."},{id:"c",text:"It’s only concerning if she feels uncomfortable."}],correct:"b",explanation:"Power over someone’s future makes saying no harder. Secrecy and linking opportunity to personal time are warning signs, whatever she feels in the moment. Workplaces are expected to have an Internal Committee under the POSH Act (verification pending).",topicId:"power"},{id:"ss3",prompt:"A partner demands your phone password “to prove you have nothing to hide”. Which statement is most accurate?",options:[{id:"a",text:"Sharing passwords on demand is the best proof of trust."},{id:"b",text:"If saying no leads to anger or accusations, this is control presented as care."},{id:"c",text:"One request means the whole relationship is abusive."}],correct:"b",explanation:"Trust that has to be enforced isn’t trust. Patterns matter more than one moment, so a single request doesn’t define a relationship — but a no that carries a cost is a warning sign.",topicId:"control"},{id:"ss4",prompt:"As fest head, you hear a junior was moved off her team after raising a concern about a senior. What is the best description?",options:[{id:"a",text:"A normal reshuffle; no need to think further."},{id:"b",text:"Possible retaliation, which is a separate concern the institution should be able to consider."},{id:"c",text:"Proof the senior did something wrong."}],correct:"b",explanation:"A change that follows a concern may be retaliation. You can’t decide that yourself, but you can notice it and make sure she knows the route to raise it. UGC 2015 regulations include protection against victimisation (verification pending).",topicId:"institutions"},{id:"ss5",prompt:"A friend was turned down and wants to post the other person’s old chats on a meme page. What response separates feeling from action?",options:[{id:"a",text:"“That hurt — I get it. Posting her chats to humiliate her isn’t okay.”"},{id:"b",text:"“Do what you want, not my business.”"},{id:"c",text:"“She deserves it for embarrassing you.”"}],correct:"a",explanation:"You can acknowledge disappointment without supporting retaliation. A no is not a debt.",topicId:"entitlement"},{id:"ss6",prompt:"A friend wants to post an allegation online on behalf of someone else who hasn’t asked for it. What is the main problem?",options:[{id:"a",text:"It takes the decision away from the person affected and may expose her further."},{id:"b",text:"Online posts are never seen by anyone."},{id:"c",text:"There is no problem if the allegation is true."}],correct:"a",explanation:"Supporting someone means following their choices. Public posts can identify them, spread further harm, and carry legal risks for the poster.",topicId:"support"},{id:"ss7",prompt:"Your friend group laughs at a joke implying a classmate got her internship through her looks. What is a realistic first step?",options:[{id:"a",text:"Laugh along, then apologise to her privately later."},{id:"b",text:"Don’t laugh, and say something short like “She worked hard for that.”"},{id:"c",text:"Give a long speech about sexism."}],correct:"b",explanation:"A short, calm response shifts the room without escalation. Many people in a group privately disagree; someone has to say it first.",topicId:"peer-norms"},{id:"ss8",prompt:"What does completing a programme like SAMMAN show about a person?",options:[{id:"a",text:"That they are safe."},{id:"b",text:"That they have taken part — nothing about their future behaviour."},{id:"c",text:"That they will intervene as a bystander."}],correct:"b",explanation:"Research finds education changes attitudes more reliably than behaviour. Completion certifies nothing about safety.",topicId:"institutions"}]},{id:"supporting-adults",label:"Adults supporting students",ages:"Parents, teachers and staff",description:"Responding to a disclosure, avoiding blame, knowing your role and its limits.",available:!0,questions:[{id:"sa1",prompt:"A student tells you something happened at a party. What is the best first response?",options:[{id:"a",text:"“Why were you there so late?”"},{id:"b",text:"“Thank you for telling me. It’s not your fault. What would help right now?”"},{id:"c",text:"“Tell me everything that happened, in order.”"}],correct:"b",explanation:"Blame and detailed questioning are associated with worse outcomes for people who disclose. Listen, believe that it matters, and ask what they need.",topicId:"support"},{id:"sa2",prompt:"As a staff member, a student asks you to promise total secrecy before telling you something. What should you do?",options:[{id:"a",text:"Promise, so that they will talk."},{id:"b",text:"Explain honestly what you can and cannot keep confidential in your role, then let them decide."},{id:"c",text:"Refuse to listen until they agree to a formal complaint."}],correct:"b",explanation:"A broken promise damages trust. Know your role’s duties and your institution’s procedure before such conversations, and explain them clearly.",topicId:"support"},{id:"sa3",prompt:"The student who discloses is 17. What changes?",options:[{id:"a",text:"Nothing; treat them exactly as an adult."},{id:"b",text:"Different legal duties may apply (for example under the POCSO Act). Follow the institution’s procedure and seek qualified advice."},{id:"c",text:"You must investigate yourself before doing anything."}],correct:"b",explanation:"In India, legal duties can differ when someone is under 18. This summary is not legal advice; the institution’s under-18 procedure must be reviewed by a qualified lawyer. Never investigate yourself.",topicId:"institutions"},{id:"sa4",prompt:"Your adult daughter tells you about a friend being pressured by a boyfriend. Which response avoids protective framing that limits women’s choices?",options:[{id:"a",text:"“This is why girls shouldn’t go out with boys.”"},{id:"b",text:"“That sounds hard for her. What do you think she wants? How can you support her?”"},{id:"c",text:"“Tell her to stop seeing her friends so it doesn’t happen again.”"}],correct:"b",explanation:"Restricting women’s lives isn’t prevention. Responsibility lies with the person applying pressure. Supporting the friend’s own choices matters most.",topicId:"control"},{id:"sa5",prompt:"In class, a student says, “She was drinking, so she’s partly responsible.” What should an educator do?",options:[{id:"a",text:"Let the class debate it as one opinion."},{id:"b",text:"Correct it calmly with the fact first: responsibility lies with the person who chooses to harm."},{id:"c",text:"Ignore it to avoid conflict."}],correct:"b",explanation:"Victim-blaming should be corrected, not balanced. Lead with the accurate statement rather than repeating the myth, then ask what the comment assumes.",topicId:"sexism"},{id:"sa6",prompt:"What should an institution publish so students can find help?",options:[{id:"a",text:"Only a general email address."},{id:"b",text:"Committee composition and contacts, a plain-language process, confidentiality limits and protection against retaliation."},{id:"c",text:"Nothing; students should ask a teacher."}],correct:"b",explanation:"Clear, accessible information is part of institutional responsibility. The Supreme Court has directed institutions to publish committee details (secondary source; verification pending).",topicId:"institutions"}]},{id:"under-18",label:"Under 18",ages:"Children and adolescents",description:"Age-appropriate content for younger people.",available:!1,unavailableReason:"Not available. Content for children and adolescents must be developed separately — not adapted from this adult material — with specialist review, safeguarding design, permissions, developmental adaptation and checks of mandatory-reporting duties. None of that has happened yet.",questions:[]}],Ta={consent:{topicId:"consent",title:"Consent is a present-tense yes",keyIdea:"Consent is voluntary, specific and ongoing. It can change at any moment, and earlier agreement doesn’t decide now.",points:["Hesitation, silence or going still is a signal to pause and check, not to wait for a firm no.","A relationship, past intimacy or flirting earlier does not create permission.","If someone may be too intoxicated to decide clearly, the respectful choice is to stop."],trySaying:"“Want to keep going, or stop here? Either is completely fine.”",scenarioId:"after-not-tonight"},entitlement:{topicId:"entitlement",title:"A no is not a debt",keyIdea:"No one owes attention, affection or a second chance — not for gifts, persistence or strong feelings.",points:["Repeating requests after “please stop” overrides the other person’s answer.","Disappointment is real and belongs to the person feeling it; it is not the other person’s job to fix.","As a friend, you can support the feeling and still refuse to help with the plan."],trySaying:"“That really hurts, I get it. It’s still her call.”",scenarioId:"just-persistent"},sexism:{topicId:"sexism",title:"Responsibility sits with the person who harms",keyIdea:"Clothing, drinking or being out late do not cause harassment. Jokes that degrade women tell a group what is acceptable.",points:["Correct victim-blaming with the fact first, rather than repeating the claim.","Not laughing is already a response; a short sentence can shift a room.","A sexist joke and an assault are different in seriousness. Challenging one is not accusing someone of the other."],trySaying:"“What she wore isn’t the reason. The person who did it is.”",scenarioId:"only-a-joke"},"peer-norms":{topicId:"peer-norms",title:"Someone has to say it first",keyIdea:"People often go along with a group because they assume everyone else approves. Often, many privately disagree.",points:["Short, calm responses work better than long speeches.","Speaking privately to a friend can be easier and more effective.","Challenge what was said, not who the person is — and avoid organising a pile-on."],trySaying:"“Not funny, man.” — then move the conversation on.",scenarioId:"only-a-joke"},digital:{topicId:"digital",title:"Every forward is another copy",keyIdea:"Sharing someone’s private or sexualised images without consent is a serious harm, whether or not the image is “real”.",points:["Don’t open, save or forward. Report it on the platform.","If it’s safe, ask the sender privately to delete it.","If you tell the person affected, share what you know and offer options — let them decide."],trySaying:"“Delete this. She didn’t agree to it.”",scenarioId:"forwarded"},power:{topicId:"power",title:"Power changes what “yes” means",keyIdea:"When someone controls grades, roles, jobs or belonging, the other person may not feel free to say no.",points:["Secrecy and linking opportunities to personal attention are warning signs.","A change in treatment after someone raises a concern may be retaliation — a separate concern.","Institutions are expected to provide a route; individuals don’t need to handle this alone."],trySaying:"“The secrecy part seems off to me. What would you like to do?”",scenarioId:"the-internship"},control:{topicId:"control",title:"Care respects a no; control punishes it",keyIdea:"Checking phones, limiting friends or clothes, or demanding proof of loyalty can be presented as love. It is control when saying no has a cost.",points:["Look at patterns, not one moment.","Restricting women’s lives is not protection. Responsibility lies with the person applying pressure.","If something feels familiar, general support routes are on the Support page."],trySaying:"“I trust you — and I don’t need your password to do that.”",scenarioId:"after-not-tonight"},support:{topicId:"support",title:"Listen, believe, ask — don’t investigate",keyIdea:"When someone shares something difficult, your role is to listen and support their choices — not to find out exactly what happened.",points:["Say: thank you for telling me; it’s not your fault; what would help?","Don’t promise secrecy you can’t keep; be honest about your limits.","Don’t take over — don’t report, post or confront on their behalf without asking."],trySaying:"“Thank you for telling me. What would help right now?”",scenarioId:"dont-tell-anyone"},institutions:{topicId:"institutions",title:"Institutions have a job to do",keyIdea:"Colleges are expected to publish clear routes: committee contacts, process, confidentiality limits and protection from retaliation.",points:["Know where the official information is before you need it.","One staff member’s dismissal is not the institution’s final answer.","Completing a programme certifies nothing about anyone’s safety."],trySaying:"“Could you tell us what the college’s process is, or who handles this?”",scenarioId:"senior-everyone-likes"},barriers:{topicId:"barriers",title:"Open is not the same as accessible",keyIdea:"Language, disability, money and discrimination can make the same support route harder for some people to use.",points:["Ask what would make support easier to reach.","Don’t assume anyone’s experience from a group they belong to."],trySaying:"“What would make this easier for you?”",scenarioId:"the-internship"}},Gl={consent:{id:"rc-consent",prompt:"Two people are making out. One goes quiet and stops kissing back, but doesn’t say anything. What should the other person do?",options:[{id:"a",text:"Keep going — they haven’t said no."},{id:"b",text:"Pause and check in, making it easy to stop."},{id:"c",text:"Ask why they’re being weird."}],correct:"b",explanation:"Silence and stillness are not agreement. Pausing and making stopping easy is the respectful response.",topicId:"consent"},entitlement:{id:"rc-entitlement",prompt:"Someone bought a classmate an expensive birthday gift. She then says she isn’t interested in dating him. What does she owe him?",options:[{id:"a",text:"At least one date, to be fair."},{id:"b",text:"Nothing — a gift is not a contract."},{id:"c",text:"The money back."}],correct:"b",explanation:"A gift that comes with conditions isn’t a gift. Her answer stands.",topicId:"entitlement"},sexism:{id:"rc-sexism",prompt:"A friend says, “She shouldn’t have gone to that party if she didn’t want trouble.” What is the accurate response?",options:[{id:"a",text:"He has a point about being careful."},{id:"b",text:"Going to a party doesn’t cause harm; the person who harms is responsible."},{id:"c",text:"Say nothing to keep the peace."}],correct:"b",explanation:"Placing responsibility on her for someone else’s choice is victim-blaming. Lead with the fact.",topicId:"sexism"},"peer-norms":{id:"rc-peer",prompt:"In a group, everyone laughs at a joke about a classmate’s body. You think most people are uncomfortable but laughing anyway. What is a realistic step?",options:[{id:"a",text:"Laugh too — everyone else is."},{id:"b",text:"Don’t laugh, and say something short like “Not cool.”"},{id:"c",text:"Post about it publicly to shame the person who joked."}],correct:"b",explanation:"A short response can give others permission to disagree too, without humiliating anyone.",topicId:"peer-norms"},digital:{id:"rc-digital",prompt:"A friend shows you private screenshots of his ex’s messages and says he’ll send them to her new class group. What is the best response?",options:[{id:"a",text:"Tell him not to — sharing her private messages without consent is harmful — and don’t forward them yourself."},{id:"b",text:"Ask him to send them to you first."},{id:"c",text:"It’s fine if the messages are true."}],correct:"a",explanation:"Private material shared to humiliate someone is harmful whether or not it is true. Refuse to take part.",topicId:"digital"},power:{id:"rc-power",prompt:"A professor offers a student extra marks if she helps him “privately” at his home on weekends. Why is this concerning?",options:[{id:"a",text:"It isn’t; extra marks are a good deal."},{id:"b",text:"He controls her grades and is linking them to private time — she may not feel free to refuse."},{id:"c",text:"Only if other students find out."}],correct:"b",explanat
