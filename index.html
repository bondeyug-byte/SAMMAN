{time:"25–55",activity:"Scenario: After “not tonight”",detail:"Private choices; small-group discussion of where pressure appears."},{time:"55–75",activity:"Principles and the law",detail:"What SAMMAN teaches as principle; where Indian law currently differs (prepared, reviewed text only)."},{time:"75–85",activity:"New-situation practice",detail:"A different short vignette (not repeated from the session)."},{time:"85–90",activity:"Close",detail:"Take-away practice and support information."}],scenarioIds:["only-a-joke","after-not-tonight"],topicIds:["consent","control","sexism"],discussion:["What makes stopping “cost nothing” for the other person?","Why might someone agree to something they don’t want? What does that tell us about pressure?","Where does the idea that a relationship creates permission come from?"],reflection:"Private, optional: write one sentence you could say to make it easy for someone to say no to you. You do not need to share it.",takeaway:"Practise saying “okay” — and only “okay” — when someone declines something, this week.",followUp:"A brief optional check-in two weeks later with a new scenario, not repeated from the session."},{id:"s2",number:"02",title:"Entitlement, rejection and peer norms",duration:"90 minutes (proposed)",objectives:["Identify beliefs that turn rejection into a grievance: owed attention, gifts as obligations, persistence as romance.","Practise responding to a friend’s disappointment while holding a line on harmful action.","Explore how assumptions about what peers approve of can keep people silent."],preparation:["Prepare an optional anonymous in-room poll (paper slips) on peer norms. Results are discussed only as a whole group.","Plan how to respond if someone defends retaliation (see Facilitator Toolkit)."],contentNote:"Discusses rejection, unwanted messaging and humiliation. No graphic content.",sequence:[{time:"0–10",activity:"Opening",detail:"Ground rules recap, content information, support routes."},{time:"10–40",activity:"Scenario: “He’s just persistent”",detail:"Three decisions; pair discussion after each."},{time:"40–55",activity:"Peer-norms poll",detail:"Optional anonymous slips: “How many of your friends think…?” compared with “What do you think?”"},{time:"55–80",activity:"Scenario: The plan",detail:"Focus on separating feelings from actions."},{time:"80–90",activity:"Close",detail:"Take-away practice and support information."}],scenarioIds:["just-persistent","the-plan"],topicIds:["entitlement","peer-norms"],discussion:["What do friends usually say after someone is rejected? What does it encourage?","How can you support a friend’s feelings without supporting their plan?"],reflection:"Private, optional: think of one phrase your group uses about rejection. What does it assume?",takeaway:"Next time a friend is turned down, try: “That sucks. It’s still her call.”",followUp:"Optional check-in with a new scenario about group humour."},{id:"s3",number:"03",title:"Digital boundaries, power and control",duration:"90 minutes (proposed)",objectives:["Recognise digital harms: forwarding, sexualised edits, password demands and monitoring.","Recognise how power over grades, roles or jobs affects whether someone can say no, and what retaliation can look like.","Identify safe actions for bystanders in digital spaces, and the limits of individual action."],preparation:["Confirm current platform reporting and cybercrime-portal information; mark anything unverified.","Never show, simulate or describe abusive images. Use the text scenarios only."],contentNote:"Discusses non-consensual sexualised images (never shown or described), workplace pressure and possible retaliation.",sequence:[{time:"0–10",activity:"Opening",detail:"Ground rules, content information, support routes."},{time:"10–45",activity:"Scenario: Forwarded, not created",detail:"Multiple decisions; focus on forwarding and the “not real” excuse."},{time:"45–75",activity:"Scenario: The internship",detail:"Power, financial dependence and retaliation."},{time:"75–85",activity:"Group norms exercise",detail:"Draft a group-chat norm the room agrees with (no names, no real incidents)."},{time:"85–90",activity:"Close",detail:"Take-away practice and support information."}],scenarioIds:["forwarded","the-internship"],topicIds:["digital","power","control","barriers"],discussion:["Why might “it’s not even real” be persuasive? What does it ignore?","How can someone tell whether an opportunity is linked to personal attention?"],reflection:"Private, optional: what would you want a group chat to do if your image were shared without consent?",takeaway:"Propose one consent norm in a group chat you belong to.",followUp:"Optional check-in with a new scenario about monitoring presented as care."},{id:"s4",number:"04",title:"Bystander action and supportive responses",duration:"90 minutes (proposed)",objectives:["Choose among safe bystander options — interrupting, getting help, checking in — without physical confrontation.","Respond to a disclosure by listening, believing, avoiding blame and respecting choice, while being honest about limits.","Describe what the institution is responsible for, including protection against retaliation."],preparation:["Have the institution’s verified support information ready to hand out.","Re-read the disclosure guidance and the institution’s procedure, including any different duties for under-18 participants."],contentNote:"Discusses harassment, disclosure of an unwanted sexual experience (no details), and dismissal of a concern.",sequence:[{time:"0–10",activity:"Opening",detail:"Ground rules, content information, support routes."},{time:"10–30",activity:"Scenario: Outnumbered",detail:"Map safe options on the board."},{time:"30–55",activity:"Scenario: “Don’t tell anyone”",detail:"Listening is not investigating; honest limits."},{time:"55–80",activity:"Scenario: The senior everyone likes",detail:"Power, dismissal and retaliation; the institution’s role."},{time:"80–90",activity:"Close and programme review",detail:"Where to find support; optional anonymous feedback on the programme (not on individuals)."}],scenarioIds:["outnumbered","dont-tell-anyone","senior-everyone-likes"],topicIds:["support","institutions","peer-norms"],discussion:["What is one low-risk action you could take when outnumbered?","What is the difference between supporting someone and taking over?","What would make the college route easier to find and trust?"],reflection:"Private, optional: what could you honestly promise if a friend told you something difficult?",takeaway:"Save the institution’s verified support contacts somewhere you can find them.",followUp:"Optional follow-up with a new scenario 4–8 weeks later. Participation is voluntary."}],Id=Object.fromEntries(Sa.map(e=>[e.id,e])),Ca=[{id:"consent",letter:"A",title:"Consent and autonomy",summary:"Voluntary choice, boundaries, pressure, changing one’s mind, and assumptions based on relationships or earlier interactions.",explanation:["Consent is a voluntary, specific and ongoing agreement. It applies to a particular act at a particular time, and either person can change their mind.","Agreement given because someone feels worn down, afraid of the consequences, or unable to say no freely is not the same as a free choice. Silence, stillness or not pushing someone away is not agreement.","Being in a relationship, having agreed before, or having flirted earlier does not create permission now. Each person keeps the right to decide.","Alcohol and drugs can affect a person’s ability to understand and choose. If you are unsure whether someone is able to decide, the respectful choice is to stop."],justifications:[{claim:"“We have done this before.”",response:"Past agreement describes the past. It does not decide what someone wants today."},{claim:"“She didn’t say no.”",response:"The question is whether there was a clear, willing yes — not whether someone managed to refuse."},{claim:"“I only asked a few more times.”",response:"Repeated asking after a no or a hesitation is pressure. It makes the other person responsible for refusing again and again."}],alternatives:["Ask, and treat hesitation as a no for now.","Make stopping easy and free of sulking, guilt or cost.","Check in again rather than assuming the earlier answer still stands."],reflection:["What makes it hard for someone to say no in a relationship that matters to them?","How can a person make it clear that stopping will not cost the other person anything?"],lawNote:"Indian criminal law (Bharatiya Nyaya Sanhita, 2023, s.63, Explanation 2) describes consent as an unequivocal voluntary agreement to the specific act, and says lack of physical resistance is not, by that fact alone, consent. The same section keeps an exception for married couples that is under constitutional challenge, and most sexual-offence sections are framed around women as victims. SAMMAN’s principles apply to everyone and are educational, not a statement of what the law currently provides. Status: secondary sources; legal review required.",scenarioIds:["after-not-tonight","only-a-joke"]},{id:"entitlement",letter:"B",title:"Entitlement and rejection",summary:"Believing attention, intimacy or affection is owed; treating gifts or spending as an obligation; accepting rejection without pressure or retaliation.",explanation:["Entitlement is the belief that someone owes you attention, affection, time or intimacy — because you were kind, spent money, waited, or feel strongly.","Rejection can hurt. The disappointment is real, and it belongs to the person who feels it. It is not the other person’s job to manage it.","Responding to a no with bargaining, guilt, persistence, humiliation, threats or retaliation turns disappointment into harm. Most people who are rejected do none of these things; the point is to recognise the pattern early."],justifications:[{claim:"“I spent so much on her.”",response:"A gift is not a contract. If it came with conditions, it was not a gift."},{claim:"“Persistence is romantic.”",response:"After a clear no, persistence tells the other person their answer does not count."},{claim:"“She led me on.”",response:"Friendliness, replies or past interest do not oblige anyone to continue."}],alternatives:["Say: “Okay. Thanks for being straight with me.”","Talk to a friend or counsellor about the disappointment, not about getting back at someone.","As a friend, separate the feeling (“that hurts”) from the action (“and posting her chats is not okay”)."],reflection:["What do friends say after someone is rejected? What do those words encourage?","What does it look like to take responsibility for your own disappointment?"],scenarioIds:["just-persistent","the-plan"]},{id:"sexism",letter:"C",title:"Everyday sexism",summary:"Objectification, degrading jokes, victim-blaming, unequal standards, and dismissing discomfort.",explanation:["Everyday sexism includes reducing a person to how they look, jokes that degrade women, holding women to different standards, and treating a woman’s boundary-setting as arrogance.","These behaviours differ in seriousness and consequences from assault. They are not all the same thing, and one does not inevitably lead to another. They can, however, share an assumption: that women’s comfort, choices or achievements matter less.","Challenging conduct is different from diagnosing someone’s character. The aim is to question what was said or done."],justifications:[{claim:"“It was only a joke.”",response:"A joke can still tell people what the group finds acceptable. Who is the joke at the expense of?"},{claim:"“She’s overreacting.”",response:"Discomfort is information. Dismissing it teaches people not to raise it."},{claim:"“Look at what she was wearing.”",response:"Clothing does not cause harassment or assault. Responsibility lies with the person who chooses to harm."}],alternatives:["Don’t laugh. A flat “not funny” changes the room more than people expect.","Ask a genuine question: “What do you mean by that?”","Check in privately with the person targeted, if they want that."],reflection:["Which comments do you hear often enough that they stop being noticed?"],scenarioIds:["only-a-joke","outnumbered"]},{id:"peer-norms",letter:"D",title:"Peer norms",summary:"Laughing along, defending friends automatically, challenging harmful conduct, and seeking support safely.",explanation:["People often laugh along or stay quiet to keep their place in a group. Research in the US suggests many young men overestimate how much their peers approve of sexist talk, and that this belief makes them less likely to speak up. Whether this holds among Indian students has not been measured.","A group can set clear expectations: “we don’t share people’s pictures”, “we don’t pile on someone who said no”.","Challenging a friend does not require public humiliation. Organising a pile-on can create a new harm."],justifications:[{claim:"“He’s our friend — he’d never do that.”",response:"Loyalty to a friend does not require deciding what happened before anyone has listened."},{claim:"“Everyone thinks the same; I’d look weird.”",response:"Others in the group may privately disagree too. Someone has to say it first."}],alternatives:["Speak to the friend privately and directly.","Find one other person who agrees before raising it with the group.","Name the group expectation, not the person’s character."],reflection:["What would it take for your group to change one shared habit?"],scenarioIds:["just-persistent","forwarded","the-plan"]},{id:"digital",letter:"E",title:"Digital boundaries",summary:"Repeated unwanted contact, password demands, location monitoring, sharing private material, and non-consensual sexualised edits.",explanation:["Repeated messages after someone has asked you to stop, creating new accounts to reach them, and asking friends to message on your behalf are all ways of overriding their choice.","Demanding passwords or tracking someone’s location can be presented as care or trust. It is control when one person cannot say no without consequences.","Sharing a person’s private messages or images without permission — or creating or forwarding a sexualised edit of them — is a serious harm, whether or not the image is “real”. Forwarding it once still spreads it.","This module describes the harm and how to respond. It does not, and will not, explain how such material is made or distributed."],justifications:[{claim:"“It’s AI, it isn’t even real.”",response:"The harm is real: it uses a real person’s identity without their consent and others can still see it."},{claim:"“Sharing it once doesn’t matter.”",response:"Each forward creates another copy outside anyone’s control."},{claim:"“If you have nothing to hide, show me your phone.”",response:"Privacy is not a confession. Trust that is enforced is not trust."}],alternatives:["Don’t open, save or forward. Report the content on the platform.","Ask the sender privately to delete it, if that is safe.","Tell the person affected only in a way that respects their choices, and share options rather than taking over."],reflection:["What group-chat norms would make forwarding less likely?"],lawNote:"Reference points (verification pending, not legal advice): BNS 2023 s.77 covers voyeurism and sharing intimate images without consent, even where the original capture was agreed; s.78 covers repeated unwanted contact and monitoring of a woman’s electronic communication. IT Act 2000 s.66E (privacy) is gender-neutral. Under 2026 amendments to the IT Rules, platforms are reportedly required to remove non-consensual intimate or morphed imagery within 2 hours of a complaint (previously 24). Status: secondary sources; official gazette text not checked; legal review required.",scenarioIds:["forwarded","just-persistent"]},{id:"power",letter:"F",title:"Power imbalances",summary:"Senior–junior, teacher–student and supervisor–intern situations; fear of losing opportunities; retaliation; conflicts of interest.",explanation:["When one person controls grades, references, roles, accommodation or belonging, the other person may go along with things they do not want. Apparent agreement does not mean they had an equal choice.","Pressure can be disguised as opportunity: “let’s discuss your future over dinner”, “keep this between us”.","Retaliation after a concern is raised — losing a role, being excluded, being given worse work — is a separate harm. Institutions are expected to protect against it."],justifications:[{claim:"“She agreed to go.”",response:"Ask what she believed would happen if she said no."},{claim:"“He’s brilliant at his job.”",response:"Being good at a role does not decide whether a concern is valid. It can make speaking up harder."}],alternatives:["Keep work and personal attention separate if you hold power.","If you notice a pattern, check in with the junior person privately and share options.","Know who in the institution handles these concerns, and how."],reflection:["Where in your college does one person’s decision affect another’s future?"],lawNote:"Institutional routes (verification pending): the UGC 2015 regulations on sexual harassment in higher education require an Internal Complaints Committee with student members and protection against victimisation. The POSH Act 2013 applies to workplaces, which can include internships. Exact provisions and how they apply must be confirmed with the host institution and a qualified lawyer.",scenarioIds:["senior-everyone-likes","the-internship"]},{id:"control",letter:"G",title:"Control disguised as care",summary:"Restrictions on friendships or communication, demands to prove loyalty, and jealousy used as justification.",explanation:["Controlling behaviour often arrives with a caring explanation: “I just worry about you”, “I only want to know you’re safe”.","Patterns matter more than single moments: limiting who someone sees, what they wear, where they go, or checking their phone, especially when saying no leads to anger, sulking or threats.","One answer in a scenario or quiz cannot describe a whole relationship. If something here feels familiar, general support routes are listed on the Support page."],justifications:[{claim:"“I’m jealous because I love you.”",response:"Feelings are real; the choice to restrict someone because of them is still a choice."},{claim:"“If you loved me, you’d share your password.”",response:"Love does not require giving up privacy on demand."}],alternatives:["Talk about the worry instead of making a rule for the other person.","Agree on shared expectations that both people can freely decline."],reflection:["How do you tell the difference between care and control?"],scenarioIds:["after-not-tonight"]},{id:"support",letter:"H",title:"Supportive responses",summary:"Listening without blame, respecting choices, avoiding interrogation, and explaining limits.",explanation:["How someone responds when a person shares a difficult experience matters. Research links blaming, disbelieving or taking control with worse wellbeing for the person who disclosed. These studies are correlational, but taking control — pushing someone to report, or acting without asking — is a common reaction even among well-meaning friends.","Supportive listening is not an investigation. You do not need proof, details or a decision about what happened. Your role is to listen, believe that this matters to them, and ask what they want.","Be honest about your limits. Don’t promise secrecy you cannot keep. If you hold a formal role, find out before any conversation what you are required to do."],justifications:[{claim:"“I need to know exactly what happened to help.”",response:"You do not. Asking for details can feel like being questioned. Ask what would help."},{claim:"“If it was serious, she would have reported it.”",response:"People have many reasons not to report, including fear of being judged or not believed."}],alternatives:["“Thank you for telling me. It’s not your fault. What would help right now?”","“I won’t share this without your OK.” (Only if true for your role.)","“Would you like me to find out what support is available, or come with you?”"],reflection:["What would you want someone to say if you shared something difficult?"],scenarioIds:["dont-tell-anyone","outnumbered"]},{id:"barriers",letter:"I",title:"Access barriers",summary:"Fictional examples of how language, disability, financial dependence or discrimination can affect access to support.",explanation:["The same support route can be harder to use for some people. A form only in English, an office up a flight of stairs, a scholarship that depends on staying quiet, or a fear of being treated differently because of caste, community or sexuality can each stand in the way.","Examples here are fictional and are not descriptions of any group. Experiences differ between people within every group.","SAMMAN does not ask for, record or infer anyone’s caste, religion, sexuality, disability or personal history."],justifications:[{claim:"“The process is open to everyone.”",response:"Open is not the same as accessible. Ask who finds it hardest to use and why."}],alternatives:["Offer information in more than one format and language (once reviewed translations exist).","Ask the person what would make support easier to reach, rather than assuming."],reflection:["Fictional example: a student whose fee waiver depends on a staff member’s recommendation. What might make raising a concern harder for her?"],scenarioIds:["the-internship","senior-everyone-likes"]},{id:"institutions",letter:"J",title:"Institutional responsibility",summary:"Clear support roles, accessible information, appropriate procedures and fair handling.",explanation:["A course cannot substitute for a responsible institution. Students need to know who to contact, what will happen next, what is kept confidential and what is not, and how they will be protected from retaliation.","Fair procedures matter for everyone involved. Education is not adjudication: this programme does not decide whether something happened.","Reviews of prevention programmes suggest institution-wide measures — policy, staffing, safe environments — matter alongside classroom sessions."],justifications:[{claim:"“We have a committee; that’s enough.”",response:"A committee that students cannot find, reach or trust does not function as support."}],alternatives:["Publish committee composition, contacts and process in plain language.","Review the information regularly and name who is responsible for updates."],reflection:["If you needed help tomorrow, would you know where to go?"],scenarioIds:["senior-everyone-likes","the-internship"]}],Vt=Object.fromEntries(Ca.map(e=>[e.id,e])),gn=[{id:"forwarded",title:"Forwarded, not created",summary:"A class group chat shares a sexualised edit of a classmate without her permission.",topicIds:["digital","peer-norms","support"],sessionId:"s3",contentNote:"Mentions a sexualised edited image of a student, shared without consent. The image is never described.",readingMinutes:7,setting:"A 40-member class group chat at a fictional college, late evening.",characters:[{name:"You",role:"A second-year student in the group"},{name:"Rohan",role:"Class representative; popular and well connected"},{name:"Ananya",role:"A classmate; not a member of this chat"},{name:"Farhan",role:"A friend of yours in the same chat"}],power:"Rohan is the class representative and organises the class trips. People worry about being left out if they cross him.",perspective:"You are deciding what you do.",stages:[{id:"arrives",title:"The image arrives",narrative:["Rohan posts an image in the class group. It is Ananya’s face, edited onto a sexualised picture. Underneath he writes, “Made this in two minutes 😂”.","Within seconds, three people reply with laughing emojis. Ananya is not in this group."],question:"What do you do first?",responsibility:"Rohan is responsible for creating and posting the image. Everyone who laughs, saves or forwards it adds to the harm. Ananya is not responsible for any of it.",outsideRole:"You do not need to investigate, gather evidence or punish anyone. You are not responsible for fixing this alone.",options:[{id:"mute",label:"Mute the chat and say nothing.",kind:"partial",headline:"Not spreading it matters. Silence also lets the group believe everyone is fine with it.",assumption:"That staying out of it is neutral.",choice:"Ananya has no say in what is happening to her image. Silence leaves the group’s norm unchallenged.",safely:"Even without posting in the group, you could report the message on the platform or message someone privately.",next:"not-real",revisit:["peer-norms"]},{id:"group-reply",label:"Reply in the group: “Delete this. It’s not okay.”",kind:"reasonable",headline:"A short, clear public message can shift a group, if you feel safe sending it.",assumption:"That someone needs to say the first word — and it can be brief.",choice:"It signals that Ananya’s consent matters, without speaking for her.",safely:"Keep it about the image, not about attacking Rohan. You can also report the post.",next:"not-real"},{id:"forward",label:"Forward it to Farhan to ask, “Is this real?”",kind:"harmful",headline:"Forwarding creates another copy, whatever the reason. This needs correcting.",assumption:"That sending it privately, or out of curiosity, doesn’t count.",choice:"Ananya’s choice about her own image is overridden again with every copy.",safely:"Ask the question without the image: “Did you see what Rohan posted?”",next:"forwarded-on",revisit:["digital"]},{id:"report-private",label:"Don’t save or forward it. Report it on the platform and message Rohan privately to delete it.",kind:"reasonable",headline:"Reporting and a private request reduce spread without starting a public fight.",assumption:"That there is more than one safe way to act.",choice:"It stops the image travelling further while leaving Ananya’s next steps to her.",safely:"Keep your message short. If Rohan reacts with threats, stop and seek support.",next:"not-real"}]},{id:"forwarded-on",title:"It has travelled",narrative:["Farhan replies, “lol where did you get this, send more”. You realise the image is now on another phone because of your message."],question:"What now?",responsibility:"You are responsible for the copy you sent. Farhan is responsible for what he does with it. Rohan remains responsible for creating it.",outsideRole:"You cannot recall every copy. You can stop your own part and ask others to stop theirs.",options:[{id:"ask-delete",label:"Tell Farhan you made a mistake, ask him to delete it and not share it. Delete your copy.",kind:"reasonable",headline:"Owning a mistake quickly limits harm. This is what repair looks like.",assumption:"That admitting you were wrong is better than defending it.",choice:"It puts Ananya’s privacy above your embarrassment.",safely:"Then return to the group chat and consider reporting the original post.",next:"not-real"},{id:"leave-it",label:"Say nothing more. It’s already everywhere anyway.",kind:"harmful",headline:"“Already everywhere” is the reasoning that makes it everywhere.",assumption:"That one more copy doesn’t matter.",choice:"Ananya’s choice is ignored again.",safely:"You can still ask Farhan to delete it. It is not too late to act.",next:"not-real",revisit:["digital"]}]},{id:"not-real",title:"“It’s not even real”",narrative:["In the group, someone replies: “Chill. It’s AI, it’s not even real. Nobody believes it.”","A few people like the message."],question:"How do you respond to that idea?",responsibility:"The people repeating this excuse are responsible for what it encourages. You are not obliged to win the argument.",outsideRole:"You are not required to convince every person in the chat.",options:[{id:"agree",label:"Agree — it’s fake, so it’s harmless.",kind:"harmful",headline:"An edit uses a real person’s identity without consent. People can still see it, believe it and share it.",assumption:"That harm depends on whether an image is technically real.",choice:"Ananya did not agree to her face being used this way.",safely:"You can disagree briefly without a long debate.",next:"ananya",revisit:["digital","sexism"]},{id:"state-fact",label:"Reply: “It uses her real face without her permission. That’s the harm.”",kind:"reasonable",headline:"Leading with the fact, rather than repeating the excuse, is the clearer correction.",assumption:"That one clear sentence can change how others read the moment.",choice:"It centres Ananya’s consent.",safely:"Leave it there. You don’t need to keep replying.",next:"ananya"},{id:"admin",label:"Message the group admin and ask them to remove the post and set a rule.",kind:"reasonable",headline:"Asking someone with authority over the chat to act is a safe, effective step.",assumption:"That groups can set expectations.",choice:"It reduces spread without exposing Ananya further.",safely:"A simple rule — “no sharing anyone’s images without consent” — helps future situations too.",next:"ananya"}]},{id:"ananya",title:"Ananya messages you",narrative:["The next morning Ananya messages you: “Someone told me there’s a picture of me going around. Did you see it? Who has it?”"],question:"What do you say?",responsibility:"Your responsibility is to be honest about what you know and to support her choices. Decisions about reporting belong to Ananya.",outsideRole:"You are not her lawyer or investigator. You cannot promise outcomes, such as the image disappearing completely.",options:[{id:"calm-down",label:"“Don’t worry about it — it’s fake and everyone will forget.”",kind:"harmful",headline:"This minimises what is happening to her and closes the conversation.",assumption:"That reassurance is the same as support.",choice:"It decides for her how much this should matter.",safely:"Ask what she wants to know and what would help.",revisit:["support"]},{id:"honest-options",label:"Tell her what you saw, what you did, and ask what she wants. Offer to share options if she would like them.",kind:"reasonable",headline:"Honesty plus choice: she gets information and stays in control of what happens next.",assumption:"That she is the best judge of what she needs.",choice:"Her choices are respected.",safely:"Options she might want to know about include platform reporting, the national cybercrime portal, the college’s Internal Complaints Committee, and support services. See the Support page for verification status."},{id:"call-out",label:"Say you will post a public call-out of Rohan on Instagram.",kind:"partial",headline:"Anger on her behalf is understandable, but a public call-out takes the decision away from her and can spread the image further.",assumption:"That public exposure is the same as justice.",choice:"It replaces her choice with yours.",safely:"Ask before acting on her behalf. Public posts naming someone can also carry legal risks for the poster.",revisit:["support"]},{id:"police-for-her",label:"“I’m going to report this to the police for you.”",kind:"needs-support",headline:"Reporting may be an option she wants — but it is hers to choose, and she may want professional advice first.",assumption:"That acting fast is always best.",choice:"It takes control of a decision that belongs to her.",safely:"Offer to help her find information or go with her, if she decides to report.",revisit:["support"]}]}],closing:"In this illustration, the image did not disappear because of one message. What changed was who had a say: the group heard that sharing it was not acceptable, and Ananya was offered choices rather than decisions made for her.",reflection:"What would make it easier for one person in a large group chat to say “delete this”?",facilitatorPrompt:"Ask the group to list the excuses that keep people silent in group chats. Then ask: which of these would be weaker if one other person spoke first? Do not ask anyone to share real group-chat experiences."},{id:"just-persistent",title:"“He’s just persistent”",summary:"A friend keeps messaging someone who asked him to stop, and the group treats it as romance.",topicIds:["entitlement","digital","peer-norms"],sessionId:"s2",contentNote:"Unwanted repeated messages and pressure after a clear no.",readingMinutes:6,setting:"A canteen table after classes at a fictional college.",characters:[{name:"You",role:"Part of a close friend group"},{name:"Kabir",role:"Your friend"},{name:"Meher",role:"A student Kabir likes; she studies in another department"},{name:"Dev",role:"Another friend in the group"}],power:"No formal power, but strong group loyalty. Kabir is upset and the group wants to cheer him up.",perspective:"You are deciding what you do as Kabir’s friend.",stages:[{id:"draft",title:"“Help me write something”",narrative:["Kabir shows the group his phone. He has sent Meher fourteen messages this week. Her last reply, two days ago, says: “Please stop messaging me.”","“She’s just testing me,” he says. “Help me write something funny so she replies.” Dev laughs: “Persistence wins, bro.”"],question:"How do you respond?",responsibility:"Kabir is responsible for respecting Meher’s request. Friends are responsible for what they encourage. Meher is not responsible for Kabir’s feelings.",outsideRole:"You don’t need to diagnose Kabir or decide what kind of person he is.",options:[{id:"help-write",label:"Help him write a funny message.",kind:"harmful",headline:"She asked him to stop. Helping him message her again helps override her answer.",assumption:"That a clear “please stop” is a game.",choice:"Meher’s choice is being disregarded — by Kabir and now by you.",safely:"Decline to help, and say why in one sentence.",next:"new-account",revisit:["entitlement"]},{id:"clear",label:"“She asked you to stop. The respectful thing is to stop.”",kind:"reasonable",headline:"Clear and kind. It treats Meher’s words as meaning what they say.",assumption:"That friends can be honest without being harsh.",choice:"Respects Meher’s choice.",safely:"You can add: “I know it hurts.” Feelings and actions can be separated.",next:"new-account"},{id:"wait",label:"“Give it a week, then try again.”",kind:"partial",headline:"This sounds gentle, but it still treats her no as temporary.",assumption:"That “stop” means “not yet”.",choice:"Her request is postponed, not respected.",safely:"If she wants contact, she knows how to reach him.",next:"new-account",revisit:["entitlement"]},{id:"change-topic",label:"Laugh awkwardly and change the subject.",kind:"partial",headline:"Understandable — many people avoid the awkward moment. The laugh still reads as approval.",assumption:"That not commenting is neutral.",choice:"Meher is not present to speak for herself.",safely:"Even later, privately, you could say: “She did ask you to stop.”",next:"new-account",revisit:["peer-norms"]}]},{id:"new-account",title:"Another account",narrative:["Later, Kabir says Meher has blocked him. “I’ll make another account. She can’t ignore me forever.”","Dev shrugs: “He’s harmless. Let him be.”"],question:"What do you do?",responsibility:"Kabir would be choosing to get around a block — a clear signal from Meher. Dev’s “harmless” comment shapes what the group thinks is acceptable.",outsideRole:"You cannot control Kabir’s phone. You are not responsible for policing him, but you can refuse to take part.",options:[{id:"name-it",label:"“A block is a no. Making new accounts to reach her is unwanted contact. I won’t help with that.”",kind:"reasonable",headline:"This names the behaviour without attacking Kabir as a person.",assumption:"That clear limits from a friend can land differently from a stranger’s.",choice:"Meher’s block is respected.",safely:"You can say it privately to Kabir if a group setting would make him defensive.",next:"villain"},{id:"tell-meher",label:"Message Meher to warn her.",kind:"needs-support",headline:"Wanting to protect her is reasonable, but she didn’t ask, and you don’t know her well. Think about what she would want.",assumption:"That she needs to hear it from you.",choice:"Could support her choice — or add another unwanted message.",safely:"If you do contact her, keep it short and factual, and leave decisions to her. If someone’s safety seems at risk, see the Support page.",next:"villain"},{id:"agree-harmless",label:"Agree with Dev — he’s harmless.",kind:"harmful",headline:"Whether Kabir is “a good guy” doesn’t change what the behaviour does to Meher.",assumption:"That intent outweighs impact.",choice:"Meher’s choice is treated as less important than Kabir’s feelings.",safely:"Judge the behaviour, not the person’s reputation.",next:"villain",revisit:["peer-norms","entitlement"]}]},{id:"villain",title:"“So I’m the villain?”",narrative:["Kabir looks hurt. “So now I’m the villain? I thought you were my friend.”"],question:"How do you respond?",responsibility:"You are responsible for being honest. Kabir is responsible for his choices. His hurt is real, and it is his to handle.",outsideRole:"You are not his counsellor. If he seems to be struggling, you can point him to support.",options:[{id:"hold-line",label:"“I am your friend. That’s why I’m saying this. I know it hurts. It still has to stop.”",kind:"reasonable",headline:"Warmth and a clear line can coexist.",assumption:"That friendship includes honesty.",choice:"Respects both Meher’s choice and Kabir as a person.",safely:"Offer to talk about how he’s feeling — not about how to reach her."},{id:"back-down",label:"“Sorry, forget it. Do what you want.”",kind:"harmful",headline:"Backing down tells Kabir that guilt works — on you and maybe on Meher.",assumption:"That keeping the peace is more important than the harm.",choice:"Meher’s choice falls away again.",safely:"You can be kind and still not take it back.",revisit:["peer-norms"]},{id:"creep",label:"Call him a creep in front of everyone.",kind:"partial",headline:"The behaviour needed challenging; a public label tends to make people defensive rather than reflective.",assumption:"That shame changes behaviour.",choice:"Shifts the focus from Meher to a fight between friends.",safely:"Name the action, not the person, ideally privately.",revisit:["peer-norms"]}]}],closing:"This illustration does not tell you how Kabir would actually respond. It shows that friends are part of the conversation about what counts as acceptable, and that holding a line can be done with care.",reflection:"What phrases does your friend group use that turn a no into a challenge?",facilitatorPrompt:"Ask: why might “persistence” be seen as romantic? Where does that idea come from, and who does it serve? Keep the discussion on ideas, not on individual participants."},{id:"after-not-tonight",title:"After “not tonight”",summary:"A dating partner keeps applying pressure after his partner says she is not comfortable.",topicIds:["consent","control","peer-norms"],sessionId:"s1",contentNote:"Sexual pressure within a relationship. Non-graphic. No assault is described.",readingMinutes:7,setting:"A friend’s flat after a birthday dinner. The couple are alone in the living room.",characters:[{name:"Sid",role:"The character whose choices you decide; 21"},{name:"Tanvi",role:"Sid’s partner of six months; 20"},{name:"Neel",role:"Sid’s friend, who hosted the dinner"}],power:"No formal power. Relationship expectations and fear of upsetting each other matter.",perspective:"You are deciding what Sid does. This is a fictional character, not you.",stages:[{id:"not-tonight",title:"“Not tonight”",narrative:["Sid and Tanvi are kissing on the sofa. Tanvi pulls back and says, “I’m not comfortable going further tonight.”","They have been intimate before."],question:"What does Sid do?",responsibility:"Sid is responsible for respecting Tanvi’s answer, now and without cost to her.",outsideRole:"Tanvi does not owe an explanation.",options:[{id:"why",label:"Ask, “Why? We’ve done this before.”",kind:"harmful",headline:"Past agreement doesn’t create permission now. Asking her to justify a no is pressure.",assumption:"That an earlier yes carries forward.",choice:"Tanvi’s current choice is being questioned.",safely:"“Okay” is a complete response.",next:"sulk",revisit:["consent"]},{id:"okay-check",label:"Say “Okay,” and ask whether she wants to stay or head home.",kind:"reasonable",headline:"Accepting immediately, and checking what she’d like now, makes stopping cost nothing.",assumption:"That her no needs no defence.",choice:"Tanvi’s choice is fully respected.",safely:"Keep the tone easy. No sighs or silent treatment.",next:"angry"},{id:"just-little",label:"Keep going a little and say, “Just a bit more?”",kind:"harmful",headline:"Continuing after she said she isn’t comfortable is not acceptable. This must stop.",assumption:"That a small push is not pressure.",choice:"Tanvi’s choice is overridden.",safely:"Stop completely. Check whether she is okay and whether she wants to leave.",next:"sulk",revisit:["consent"]},{id:"sulk",label:"Say “Fine,” move away and go quiet.",kind:"partial",headline:"Sid stopped — which matters. But going cold can make Tanvi feel she is being punished for saying no.",assumption:"That disappointment should be shown, not handled.",choice:"Her choice is respected in action but made costly in mood.",safely:"It’s okay to feel disappointed; it’s Sid’s to manage, not Tanvi’s.",next:"angry",revisit:["consent","control"]}]},{id:"sulk",title:"The pressure builds",narrative:["Tanvi goes quiet and checks her phone. The room feels tense. She says, “I think I should go.”"],question:"What does Sid do now?",responsibility:"Sid is responsible for the pressure he applied, and for repairing it.",outsideRole:"Sid cannot decide how Tanvi feels about what happened.",options:[{id:"repair",label:"Say, “You’re right to stop me. I’m sorry I pushed. Do you want me to get you a cab?”",kind:"reasonable",headline:"A clear apology without excuses, and practical respect for her decision to leave.",assumption:"That owning the pressure is part of repair.",choice:"Her choice to leave is supported.",safely:"Don’t follow up with repeated messages asking for forgiveness.",next:"friend-asks"},{id:"guilt",label:"Say, “I just thought you loved me.”",kind:"harmful",headline:"This turns her no into a test of love. That is pressure.",assumption:"That love obliges agreement.",choice:"Her choice is reframed as a betrayal.",safely:"Separate feelings from obligations.",next:"friend-asks",revisit:["consent","control"]},{id:"block-leave",label:"Tell her to stay because it’s late and he “won’t let her” go alone.",kind:"harmful",headline:"Concern about safety can be genuine; deciding for her whether she can leave is control.",assumption:"That caring means deciding for her.",choice:"Her choice to leave is overridden.",safely:"Offer help — a cab, calling a friend — and let her decide.",next:"friend-asks",revisit:["control"]}]},{id:"angry",title:"“Are you angry?”",narrative:["A little later, Tanvi asks, “Are you angry with me?”"],question:"What does Sid say?",responsibility:"Sid is responsible for making clear that her no does not carry a cost.",outsideRole:"Tanvi is not responsible for managing Sid’s mood.",options:[{id:"not-angry",label:"“No. I’m glad you told me. We don’t need to do anything you don’t want to.”",kind:"reasonable",headline:"Clear reassurance that saying no was safe.",assumption:"That stopping is normal, not a problem.",choice:"Her choice is respected and supported.",safely:"Mean it — the next interaction should match the words.",next:"friend-asks"},{id:"whatever",label:"“It’s fine. Whatever.”",kind:"partial",headline:"The words say fine; the tone says otherwise. That ambiguity is a form of pressure.",assumption:"That she should read and fix his mood.",choice:"She is left uncertain whether saying no was safe.",safely:"Be honest and kind: “I’m a bit disappointed, but that’s mine to deal with.”",next:"friend-asks",revisit:["consent"]}]},{id:"friend-asks",title:"Neel asks",narrative:["The next day Neel texts Sid: “So?? Did you two finally… 😏”"],question:"How does Sid reply?",responsibility:"Sid is responsible for Tanvi’s privacy. Neel is responsible for the expectation in his question.",outsideRole:"Sid does not need to give Neel a lecture.",options:[{id:"private",label:"“That’s between us, man.”",kind:"reasonable",headline:"Simple and respectful. It keeps private life private.",assumption:"That a partner’s privacy is not group entertainment.",choice:"Respects Tanvi’s privacy.",safely:"A short reply is enough."},{id:"complain",label:"Complain that Tanvi “led him on”.",kind:"harmful",headline:"This blames her for his disappointment and shares her private choices.",assumption:"That earlier affection creates an obligation.",choice:"Her privacy and her right to say no are both disregarded.",safely:"If Sid needs to talk about feelings, he can do it without blaming her.",revisit:["entitlement","peer-norms"]},{id:"exaggerate",label:"Exaggerate and imply they did.",kind:"harmful",headline:"Inventing or sharing someone’s intimate life to look good with friends harms her reputation and trust.",assumption:"That status among friends matters more than her privacy.",choice:"Tanvi has no say in a story told about her.",safely:"Notice the pressure to perform for friends — and decline it.",revisit:["peer-norms"]}]}],closing:"The illustration shows how pressure can take many forms — questions, silence, guilt, “protection”, and stories told to friends — and how stopping without cost is the respectful baseline.",reflection:"What makes it easier for a partner to say “not tonight” without worrying about the reaction?",facilitatorPrompt:"Ask: what are the different ways pressure appeared in this scenario that were not physical? Avoid asking participants about their own relationships."},{id:"the-plan",title:"The plan",summary:"After being rejected, a friend plans to humiliate the person who said no.",topicIds:["entitlement","peer-norms","digital"],sessionId:"s2",contentNote:"Rejection, anger and a plan to share private messages to embarrass someone.",readingMinutes:5,setting:"A hostel room at a fictional college.",characters:[{name:"You",role:"Varun’s roommate and friend"},{name:"Varun",role:"Your friend"},{name:"Ishita",role:"A classmate who said no when Varun asked her out"}],power:"Varun is popular in a large class meme page. Ishita is new to the college.",perspective:"You are deciding what you do.",stages:[{id:"plan",title:"“Watch this”",narrative:["Varun asked Ishita out in front of friends. She said no, politely. Now he is scrolling through old chats with her.","“I’ll post some of these on the meme page with a caption. Let’s see how she likes being laughed at.”"],question:"What do you do?",responsibility:"Varun is responsible for how he responds to rejection. Ishita is not responsible for his embarrassment.",outsideRole:"You don’t need to fix Varun’s feelings or decide what kind of person he is.",options:[{id:"laugh",label:"Laugh and suggest a caption.",kind:"harmful",headline:"Helping humiliate someone for saying no punishes her for a choice she was entitled to make.",assumption:"That rejection justifies retaliation.",choice:"Ishita’s right to say no is being punished.",safely:"Refuse to help and say why.",next:"posted",revisit:["entitlement"]},{id:"separate",label:"“That hurt — I get it. But posting her chats to embarrass her isn’t okay. Want to talk about it?”",kind:"reasonable",headline:"This separates the feeling from the action and offers real support.",assumption:"That anger can be acknowledged without being acted on.",choice:"Respects Ishita’s choice and Varun as a person.",safely:"Stay with him for a bit. Plans made in anger often change when someone listens.",next:"embarrassed"},{id:"not-my-business",label:"“Do what you want. Not my business.”",kind:"partial",headline:"Staying out of it can feel safer, but it leaves the plan unchallenged.",assumption:"That neutrality is possible here.",choice:"Ishita isn’t present to speak for herself.",safely:"Even a brief “I wouldn’t” can make a difference.",next:"posted",revisit:["peer-norms"]}]},{id:"embarrassed",title:"“She embarrassed me”",narrative:["Varun says: “She embarrassed me in front of everyone. She deserves it.”"],question:"How do you respond?",responsibility:"Varun is responsible for his choices. A no does not create a debt.",outsideRole:"You are not his counsellor. If he seems very low, you can point him to support.",options:[{id:"deserves",label:"“Yeah, she shouldn’t have done it in public.”",kind:"harmful",headline:"She answered a question he chose to ask in public. Agreeing turns her answer into an offence.",assumption:"That she owed him a private or different answer.",choice:"Ishita’s choice is blamed.",safely:"You can sympathise with his embarrassment without blaming her.",revisit:["entitlement"]},{id:"reframe",label:"“Being turned down in front of people is rough. It doesn’t mean she did something to you.”",kind:"reasonable",headline:"Empathy without agreement. It gives Varun a way to step back without losing face.",assumption:"That disappointment is his to carry.",choice:"Respects her answer.",safely:"Suggest something else to do tonight — and that he talks to someone if this keeps eating at him."},{id:"counsellor",label:"Suggest he talks to the college counsellor if this keeps bothering him.",kind:"reasonable",headline:"Pointing a friend to support for strong feelings is a good option alongside a clear line.",assumption:"That getting help with feelings is normal.",choice:"Respects both people.",safely:"Be clear that the plan is still not okay."}]},{id:"posted",title:"It’s up",narrative:["An hour later the post is live on the meme page. Comments are arriving."],question:"What now?",responsibility:"Varun is responsible for the post. Commenters are responsible for adding to it. Ishita is not responsible.",outsideRole:"You cannot undo the post alone, and you do not need to investigate.",options:[{id:"ask-remove",label:"Ask Varun to take it down now, and report the post to the page admins and the platform.",kind:"reasonable",headline:"Fast removal limits harm. Reporting is safe and does not need you to confront anyone.",assumption:"That it is not too late to reduce harm.",choice:"Supports Ishita’s privacy.",safely:"If Ishita wants support, share options without taking over."},{id:"comment-defend",label:"Post a long comment attacking Varun.",kind:"partial",headline:"Defending Ishita is well-meant, but a public argument can draw more attention to the post.",assumption:"That public pushback is always helpful.",choice:"Ishita is not asked what she wants.",safely:"Report the post and speak to Varun directly instead.",revisit:["support"]}]}],closing:"In this illustration, the moment before the post was the easiest moment to change course. Friends were part of that moment.",reflection:"What would you want a friend to say to you if you were about to do something in anger?",facilitatorPrompt:"Discuss: what is the difference between supporting a friend’s feelings and supporting their plan? Ask for examples of phrases that do the first without the second."},{id:"senior-everyone-likes",title:"The senior everyone likes",summary:"A junior raises a concern about an influential senior, and the concern is dismissed.",topicIds:["power","institutions","support"],sessionId:"s4",contentNote:"Unwanted personal attention from a senior student, dismissal of a concern and possible retaliation.",readingMinutes:8,setting:"The organising committee of a fictional college’s annual festival.",characters:[{name:"You",role:"A second-year committee member"},{name:"Zoya",role:"A first-year committee member; 18"},{name:"Aditya",role:"Final-year festival head; popular, decides roles and certificates"},{name:"Prof. Rao",role:"Faculty coordinator of the festival (fictional)"}],power:"Aditya allocates roles, certificates and recommendation letters. Prof. Rao relies on him to run the festival.",perspective:"You are deciding what you do.",stages:[{id:"zoya-tells",title:"Zoya tells you",narrative:["Zoya shows you messages Aditya has sent her late at night: compliments about her appearance, asking her to come to the committee room alone after rehearsals, and “keep this between us”.","“I don’t want to make it a big thing,” she says. “I really want to stay on the committee.”"],question:"What do you say?",responsibility:"Aditya is responsible for his conduct. Zoya decides what she wants to do. The college is responsible for having a clear, safe route.",outsideRole:"You are not an investigator and do not need to decide what Aditya intended.",options:[{id:"ignore",label:"“That’s just how fest works. Ignore it.”",kind:"harmful",headline:"This normalises a pattern that is making her uncomfortable, and closes the door on support.",assumption:"That discomfort is part of belonging.",choice:"Zoya’s concerns are dismissed.",safely:"Listen first. Ask what she would like.",next:"confront",revisit:["power","support"]},{id:"listen-options",label:"Listen, thank her for telling you, and ask what she’d like. Offer to share options without pushing.",kind:"reasonable",headline:"She keeps control, and she knows support exists.",assumption:"That she is the best judge of her next step.",choice:"Her choice is respected.",safely:"Options might include the faculty coordinator, the college’s Internal Complaints Committee, or a counsellor. She can also save the messages in case she wants them later.",next:"coordinator"},{id:"confront-myself",label:"Tell her you’ll go and tell Aditya off yourself.",kind:"partial",headline:"Protective — but it could expose her to retaliation and takes the decision away from her.",assumption:"That acting for her is the same as helping her.",choice:"Her choice is overridden.",safely:"Ask before taking any step that involves her.",next:"confront",revisit:["support"]},{id:"confession",label:"Post about it anonymously on the college confessions page.",kind:"harmful",headline:"Even anonymous posts can identify her and remove her control over what happens.",assumption:"That public pressure is a substitute for a fair process.",choice:"Zoya was not asked.",safely:"Keep it private unless she decides otherwise.",next:"confront",revisit:["support","institutions"]}]},{id:"confront",title:"A second conversation",narrative:["A few days later, Zoya says the messages have continued. She looks tired. “Maybe I should just quit the committee.”"],question:"What do you say now?",responsibility:"Zoya should not have to give up something she values to avoid someone else’s behaviour.",outsideRole:"You can’t decide for her. You can make sure she knows the options.",options:[{id:"share-routes",label:"“You shouldn’t have to quit. Would it help if I found out how the committee route works, or came with you to talk to someone?”",kind:"reasonable",headline:"Offers practical support while leaving the choice with her.",assumption:"That the institution should carry this, not her alone.",choice:"Respects her choice.",safely:"If she says no, accept that and check in again later.",next:"coordinator"},{id:"quit",label:"“Honestly, quitting might be easiest.”",kind:"partial",headline:"Quitting may be her choice; suggesting it as the answer puts the cost on her.",assumption:"That the person affected should adjust.",choice:"Her choice is narrowed.",safely:"Name other options too.",next:"coordinator",revisit:["power"]}]},{id:"coordinator",title:"The coordinator responds",narrative:["Zoya decides to speak to Prof. Rao and asks you to come with her. After listening, Prof. Rao says: “Aditya is our best organiser. Are you sure you aren’t misreading him? Let’s not spoil the festival.”"],question:"What do you do?",responsibility:"Prof. Rao is responsible for taking the concern seriously and knowing the institution’s route — not for deciding whether it happened.",outsideRole:"You are there to support Zoya, not to argue her case for her.",options:[{id:"agree-drop",label:"Agree it might be a misunderstanding.",kind:"harmful",headline:"A person’s popularity or usefulness does not decide whether a concern deserves a proper response.",assumption:"That reputation outweighs a junior’s experience.",choice:"Zoya’s concern is dismissed for the second time.",safely:"You can stay quiet and let Zoya speak, rather than agreeing.",next:"retaliation",revisit:["power","institutions"]},{id:"ask-process",label:"Calmly ask: “Could you tell us what the college’s process is for this, or who handles it?”",kind:"reasonable",headline:"Redirects to the process without accusing anyone. A fair route matters for everyone involved.",assumption:"That institutions have procedures for exactly this.",choice:"Keeps Zoya’s options open.",safely:"Afterwards, check how Zoya feels and what she wants next.",next:"retaliation"},{id:"icc-direct",label:"Afterwards, help Zoya find the Internal Complaints Committee’s contact details, if she wants them.",kind:"reasonable",headline:"If one route is closed, another may exist. The choice to use it remains hers.",assumption:"That one staff member’s reaction is not the institution’s final answer.",choice:"Respects her choice.",safely:"Contact details should be published by the college. If you cannot find them, that is itself an institutional gap.",next:"retaliation"}]},{id:"retaliation",title:"A changed role",narrative:["Two weeks later, Zoya is moved from the stage team to “general volunteers”. No reason is given. Some members have stopped talking to her."],question:"What do you do?",responsibility:"If a change follows a concern, it may be retaliation. Institutions are expected to guard against this. Zoya chooses whether to raise it.",outsideRole:"You cannot decide whether this was retaliation. You can notice the pattern and offer support.",options:[{id:"notice",label:"Tell Zoya you noticed, and that a change after raising a concern is something the committee route can consider — if she wants to raise it.",kind:"reasonable",headline:"Naming the possible pattern helps her decide with full information.",assumption:"That retaliation is a separate concern that deserves attention.",choice:"Her choice is respected.",safely:"The UGC 2015 regulations on sexual harassment in higher education include protection against victimisation (verification pending). Keep including her socially."},{id:"confront-aditya",label:"Confront Aditya on Instagram.",kind:"partial",headline:"Standing up for her is right in spirit; a public confrontation can escalate and may make things harder for her.",assumption:"That speed and visibility help.",choice:"Her choice is not asked.",safely:"Ask Zoya first. Support her to use the institution’s route if she chooses.",revisit:["support"]},{id:"stay-away",label:"Keep your distance so you don’t lose your role too.",kind:"needs-support",headline:"Fear of losing your own place is real. It is also exactly how retaliation spreads.",assumption:"That you have to choose between your role and decency.",choice:"Zoya is left more isolated.",safely:"Small, private acts — sitting with her, checking in — are low-risk and matter.",revisit:["power"]}]}],closing:"This illustration shows how power works at every stage: in the messages, in the dismissal and in what happened afterwards. Individual support mattered, but so did the institution’s responsibility to have a route that works.",reflection:"Who in your college would you go to if a concern like this were dismissed?",facilitatorPrompt:"Ask: what made it hard for Zoya to speak up at each stage? What could the institution do differently? Remind participants not to discuss real people or incidents."},{id:"outnumbered",title:"Outnumbered",summary:"A bystander notices harassment at a bus stop but is alone against a group.",topicIds:["sexism","support","peer-norms"],sessionId:"s4",contentNote:"Public harassment by a group; comments about appearance.",readingMinutes:5,setting:"The bus stop outside a fictional college, early evening.",characters:[{name:"You",role:"A student waiting for the bus"},{name:"Priya",role:"A student you recognise from the library"},{name:"A group of five",role:"Older students you don’t know"}],power:"You are alone; the group is five. A security guard is at the college gate, about 50 metres away.",perspective:"You are deciding what you do.",stages:[{id:"notice",title:"You notice",narrative:["Five older students are standing close to Priya, commenting loudly on her clothes and blocking her way to the bus. She looks uncomfortable and keeps stepping back."],question:"What do you do?",responsibility:"The group is responsible for harassing her. You are not responsible for stopping them single-handedly.",outsideRole:"You never have to physically confront anyone. Your own safety matters too.",options:[{id:"confront",label:"Walk up and loudly tell them to back off.",kind:"partial",headline:"Direct action can work when it is safe. Alone against five, it may escalate — and it is never required.",assumption:"That the only real response is a confrontation.",choice:"It may help Priya, but she isn’t asked and it may increase risk for both of you.",safely:"If you speak directly, keep it short and calm, and stay out of reach.",next:"after"},{id:"distract",label:"Walk over and say to Priya, “Hey! Our bus is here — coming?”",kind:"reasonable",headline:"Distraction interrupts the situation and gives her a way out without a fight.",assumption:"That interrupting can be low-key.",choice:"Gives Priya an easy choice to leave.",safely:"Move away together towards people or the gate.",next:"after"},{id:"delegate",label:"Go to the security guard and ask him to come over.",kind:"reasonable",headline:"Bringing in someone with a role is a safe and often effective option.",assumption:"That getting help is action, not avoidance.",choice:"Supports Priya without putting you at risk.",safely:"Describe what you saw briefly. Then check on Priya.",next:"after"},{id:"record",label:"Film it on your phone and post it online.",kind:"partial",headline:"Recording can sometimes help later, but posting it without Priya’s consent exposes her too.",assumption:"That publicity helps the person targeted.",choice:"Priya’s image is shared without her say.",safely:"If you record at all, keep it private and ask her what she wants done with it.",next:"after",revisit:["digital","support"]}]},{id:"after",title:"Afterwards",narrative:["The group drifts away. Priya is shaking a little and says, “I’m fine. It’s nothing.”"],question:"What do you say?",responsibility:"Your role is to check in, not to decide what this means to her.",outsideRole:"You don’t need to persuade her to report.",options:[{id:"check-in",label:"“That wasn’t okay. Do you want me to wait with you, or walk to the gate?”",kind:"reasonable",headline:"Names that it wasn’t her fault and offers practical, specific help.",assumption:"That “I’m fine” can be respected while still offering support.",choice:"Her choice is respected.",safely:"Accept her answer. You could mention support exists if she wants it later."},{id:"clothes",label:"“Maybe wear something less attention-grabbing next time.”",kind:"harmful",headline:"Clothing does not cause harassment. This blames her for their behaviour.",assumption:"That women must restrict themselves to avoid harassment.",choice:"Her right to dress as she chooses is disregarded.",safely:"Place responsibility on the people who harassed her.",revisit:["sexism"]},{id:"must-report",label:"“You have to report this right now.”",kind:"partial",headline:"Reporting is one option; insisting on it can feel like more pressure.",assumption:"That there is one correct response.",choice:"Her choice is narrowed.",safely:"“If you ever want to report it, I can tell you what I saw.”",revisit:["support"]}]}],closing:"There were several reasonable responses here. None required confronting a group alone. The illustration shows that small, safe actions can still interrupt harm.",reflection:"What is one low-risk thing you could do in a situation where you feel outnumbered?",facilitatorPrompt:"Map the safe options on a board: interrupt, get help, check in later. Discuss which feels most realistic in different settings. Do not ask participants to role-play harassment."},{id:"dont-tell-anyone",title:"“Don’t tell anyone”",summary:"A friend shares a difficult experience and asks you to keep it secret.",topicIds:["support","institutions"],sessionId:"s4",contentNote:"A friend discloses an unwanted sexual experience. No details are described.",readingMinutes:7,setting:"Your shared room in a fictional college hostel, late at night.",characters:[{name:"You",role:"Neha’s friend and roommate; not a staff member or office-bearer"},{name:"Neha",role:"Your friend; 20"},{name:"Asha",role:"Another friend in your group"}],power:"No formal power. You are a peer. If you held a formal role (staff, student counsellor, office-bearer), your duties might be different — find out before any such conversation.",perspective:"You are deciding what you say and do.",stages:[{id:"disclosure",title:"Neha tells you",narrative:["Neha tells you that something happened at a party last month with someone from another college. She didn’t want it to happen. She hasn’t told anyone.","“Please don’t tell anyone,” she says."],question:"What do you say first?",responsibility:"The person who harmed her is responsible. Neha is not. Your role is to listen.",outsideRole:"You do not need to find out exactly what happened, decide whether it “counts”, or identify the other person.",options:[{id:"questions",label:"Ask questions to understand exactly what happened.",kind:"harmful",headline:"Even well-meant questions can feel like being interrogated or doubted. Support doesn’t require details.",assumption:"That you need the facts to help.",choice:"She loses control over how much she shares.",safely:"Let her share what she wants to. Ask what would help.",next:"struggling",revisit:["support"]},{id:"listen",label:"“Thank you for telling me. It’s not your fault. What would help right now?”",kind:"reasonable",headline:"Belief, no blame, and a question that gives her control.",assumption:"That listening is itself support.",choice:"Her choices are respected.",safely:"Silence while she talks is fine.",next:"struggling"},{id:"parents",label:"“We have to tell your parents.”",kind:"harmful",headline:"She is an adult and asked you not to tell anyone. Telling others without her agreement takes control away.",assumption:"That someone else should decide.",choice:"Her request is overridden.",safely:"Ask who, if anyone, she would want to involve.",next:"struggling",revisit:["support"]},{id:"honest-limits",label:"“I won’t share this without your OK. If I ever thought you were in immediate danger, I’d talk to you first about getting help.”",kind:"reasonable",headline:"Honest about limits without making them sound like a threat.",assumption:"That trust depends on honesty about what you can promise.",choice:"Her choices are respected, and she knows where she stands.",safely:"If she were under 18, different legal duties may apply — see the facilitator notes.",next:"struggling"}]},{id:"struggling",title:"A week later",narrative:["A week later, Neha is missing classes and says she can’t sleep. “I don’t know what to do.”"],question:"What do you do?",responsibility:"You can offer information and company. Neha decides what to use.",outsideRole:"You are not a counsellor. You can help her reach people who are.",options:[{id:"options-company",label:"Offer to find information about support — counselling, a helpline, the college committee — and to go with her if she wants.",kind:"reasonable",headline:"Practical help and choice. She doesn’t have to do this alone.",assumption:"That options help more than instructions.",choice:"Her choice is respected.",safely:"Use verified sources. See the Support page for each entry’s verification status.",next:"asha-asks"},{id:"move-on",label:"“Try to move on. Thinking about it will only make it worse.”",kind:"harmful",headline:"This tells her to stop feeling what she feels, and closes the door to support.",assumption:"That distress should be pushed away.",choice:"Her experience is dismissed.",safely:"Acknowledge it’s hard. Offer to help her find support.",next:"asha-asks",revisit:["support"]},{id:"go-icc",label:"Go to the college committee yourself and give them her name.",kind:"harmful",headline:"This breaks her trust and makes the decision for her.",assumption:"That formal action is always right.",choice:"Her request is overridden.",safely:"You can find out how the process works anonymously and tell her, if she wants.",next:"asha-asks",revisit:["support","institutions"]},{id:"own-limits",label:"Tell her you care, and that you are also finding this hard — and ask whether you could each talk to someone.",kind:"needs-support",headline:"Supporters need support too. Saying so honestly is okay.",assumption:"That you don’t have to carry everything alone.",choice:"Keeps her in control while being honest about your limits.",safely:"You can talk to a counsellor about how you are coping without sharing her identity.",next:"asha-asks"}]},{id:"asha-asks",title:"Asha asks",narrative:["Asha asks you: “What’s going on with Neha? She’s been weird.”"],question:"What do you say?",responsibility:"Neha’s story is hers to share.",outsideRole:"You don’t need to explain Neha to anyone.",options:[{id:"hers",label:"“She’s going through something. It’s for her to share if she wants. Maybe just check in on her.”",kind:"reasonable",headline:"Protects her privacy while encouraging kindness.",assumption:"That friends can support without knowing details.",choice:"Respects Neha’s choice.",safely:"Keep it at that."},{id:"hint",label:"Hint at what happened, without saying it outright.",kind:"harmful",headline:"Hints spread information she asked you to keep.",assumption:"That partial sharing doesn’t count.",choice:"Neha’s request is broken.",safely:"A simple “that’s hers to share” is enough.",revisit:["support"]}]}],closing:"Supportive listening is not investigating. In this illustration, Neha stayed in control of her own story, and support was available when she wanted it.",reflection:"What can you honestly promise when someone shares something difficult — and what can’t you?",facilitatorPrompt:"Discuss the difference between listening and investigating. Remind participants of the institution’s disclosure procedure and the facilitator’s own limits before the discussion. Do not invite personal disclosures in the group."},{id:"the-internship",title:"The internship",summary:"A supervisor connects a job opportunity with personal attention.",topicIds:["power","barriers","institutions"],sessionId:"s3",contentNote:"A supervisor’s personal attention linked to a job offer; possible retaliation.",readingMinutes:6,setting:"A summer internship at a fictional start-up.",characters:[{name:"You",role:"Shreya’s college friend, interning elsewhere"},{name:"Shreya",role:"An intern hoping for a pre-placement offer; her family relies on her finding work"},{name:"Vikram",role:"Shreya’s manager; decides on offers"}],power:"Vikram decides whether Shreya receives a pre-placement offer. Shreya depends financially on getting a job.",perspective:"You are deciding what you say to Shreya.",stages:[{id:"dinner",title:"“Is this weird?”",narrative:["Shreya shows you messages from Vikram: “Let’s discuss your offer over dinner, just us.” “You looked great today.” “Keep this between us — others might get jealous.”","“Is this weird?” she asks. “He’s being nice. I really need this offer.”"],question:"What do you say?",responsibility:"Vikram is responsible for keeping work and personal attention separate. Shreya decides what she does.",outsideRole:"You can’t decide what Vikram intends, and you can’t make the choice for Shreya.",options:[{id:"flattered",label:"“He likes you! Go — it could help your offer.”",kind:"harmful",headline:"This treats a power imbalance as an opportunity, and puts the risk on Shreya.",assumption:"That personal attention from someone with power is harmless.",choice:"Shreya’s freedom to say no without cost is ignored.",safely:"Name the power difference and let her decide.",next:"cold",revisit:["power"]},{id:"name-pattern",label:"“The secrecy and mixing your offer with dinner seem off to me. What do you want to do?”",kind:"reasonable",headline:"Names what you notice without deciding for her.",assumption:"That she can judge, given a second view.",choice:"Her choice is respected.",safely:"Suggest keeping the messages and finding out who handles concerns at the company or in college placement.",next:"cold"},{id:"quit",label:"“Quit right now.”",kind:"partial",headline:"Protective, but it ignores what quitting would cost her.",assumption:"That the person under pressure should give things up.",choice:"Her choice is narrowed.",safely:"Explore options that do not require her to lose the internship.",next:"cold",revisit:["barriers"]}]},{id:"cold",title:"After she says no",narrative:["Shreya politely declines the dinner. Since then, Vikram has stopped replying to her, removed her from a client project, and told the team her work “isn’t up to the mark”."],question:"What do you suggest?",responsibility:"If this follows her refusal, it may be retaliation. The employer and the college placement cell have responsibilities here.",outsideRole:"You can’t determine whether this was retaliation. You can help her find the people whose job it is.",options:[{id:"routes",label:"Suggest she notes dates and messages, and finds out about the company’s internal committee and her college placement cell — if she wants to raise it.",kind:"reasonable",headline:"Practical and choice-respecting. Records help if she decides to act later.",assumption:"That workplaces and colleges have routes for this.",choice:"Her choice is respected.",safely:"The POSH Act 2013 requires workplaces of a certain size to have an Internal Committee; whether and how it applies to an intern must be confirmed (verification pending)."},{id:"corporate",label:"“That’s corporate life. Just work harder.”",kind:"harmful",headline:"This treats possible retaliation as normal and leaves her alone with it.",assumption:"That powerful people’s behaviour is just the cost of work.",choice:"Her concern is dismissed.",safely:"Acknowledge that the change looks connected and that she has options.",revisit:["power","institutions"]},{id:"linkedin",label:"Suggest she posts about Vikram on LinkedIn.",kind:"partial",headline:"It is her decision whether to speak publicly; suggesting it first can expose her to further consequences.",assumption:"That public exposure is the most effective route.",choice:"Her choice should lead.",safely:"If she is considering it, she may want advice first. Public posts naming people can carry legal risks.",revisit:["support"]}]}],closing:"This illustration shows how financial dependence and power can make saying no costly, and why institutions — not just individuals — need clear routes.",reflection:"How might Shreya’s financial situation affect what feels possible for her?",facilitatorPrompt:"Ask: what signs suggested that an “opportunity” was linked to personal attention? What would a clear workplace policy need to say? Avoid generalising about any industry or group."},{id:"only-a-joke",title:"“Only a joke”",summary:"A friend makes a joke about how a classmate got her internship.",topicIds:["sexism","peer-norms"],sessionId:"s1",contentNote:"A degrading joke about a woman’s achievements.",readingMinutes:3,setting:"A table in a fictional college canteen.",characters:[{name:"You",role:"A student with friends"},{name:"Arnav",role:"A friend who likes to entertain the group"},{name:"Riya",role:"A classmate who won a competitive internship; not present"}],power:"No formal power. The group laughs easily at Arnav’s jokes.",perspective:"You are deciding what you do.",stages:[{id:"joke",title:"The joke",narrative:["News arrives that Riya has won the internship everyone applied for. Arnav says, “We all know how she got that,” and winks. Two people laugh."],question:"What do you do?",responsibility:"Arnav is responsible for the joke. Those who laugh shape what the group finds acceptable. Riya is not responsible.",outsideRole:"You don’t need to give a speech or decide what Arnav is like as a person.",options:[{id:"laugh",label:"Laugh along.",kind:"harmful",headline:"The joke suggests a woman’s success must come from something other than her work. Laughing confirms it for the group.",assumption:"That a joke has no effect.",choice:"Riya isn’t present and has no say in how she is being described.",safely:"Not laughing is already a response.",next:"reaction",revisit:["sexism"]},{id:"not-funny",label:"Don’t laugh. Say, “She worked really hard for that.”",kind:"reasonable",headline:"A short, factual counter shifts the room without a confrontation.",assumption:"That one person speaking can change the mood.",choice:"Defends Riya’s achievement without speaking for her.",safely:"Keep it light; you don’t need to win.",next:"reaction"},{id:"question",label:"Ask, “What do you mean by that?”",kind:"reasonable",headline:"A genuine question makes the assumption visible and lets Arnav reconsider.",assumption:"That people often back off when asked to explain a joke.",choice:"Neutral, and respects everyone present.",safely:"Keep your tone curious rather than accusing.",next:"reaction"},{id:"silent",label:"Stay silent and look at your phone.",kind:"partial",headline:"Not laughing helps. Without any word, others may still read silence as agreement.",assumption:"That it’s not your place to speak.",choice:"Riya is not present to answer.",safely:"A later private word with Arnav can work too.",next:"reaction",revisit:["peer-norms"]}]},{id:"reaction",title:"“Relax”",narrative:["Arnav rolls his eyes: “Relax, it’s only a joke. Why are you so serious?”"],question:"What do you say?",responsibility:"Arnav is responsible for whether he reflects. You are not responsible for changing his mind on the spot.",outsideRole:"You don’t need to win the argument.",options:[{id:"brief",label:"“I know. It’s just not a great joke about her.”",kind:"reasonable", . You can say “Let’s pick this up after the session.”"},{id:"victim-blaming",title:"Addressing victim-blaming",intro:"Victim-blaming comments must be corrected, not treated as one view among many.",points:["Lead with the accurate statement: “Responsibility lies with the person who chooses to harm.”","Avoid repeating the myth in your correction; it can make it more memorable.","Ask what the comment assumes: “What would the person have to do to be safe, by that logic?”","Remember there may be people in the room for whom the comment is personal. Correct it promptly."],limit:"You are correcting an idea, not diagnosing the person who said it."},{id:"mockery",title:"Handling mockery without humiliating participants",intro:"Mockery often signals discomfort. Respond firmly without shaming.",points:["Name the behaviour neutrally: “Let’s keep this respectful — this matters to people here.”","Re-engage: give the person a role or a question in the next activity.","If it continues, speak to them privately during a break.","If needed, ask them to take a short break outside. Do not make an example of them."],limit:"If a participant repeatedly undermines safety, follow the institution’s conduct procedure."},{id:"distress",title:"Responding to distress",intro:"Some participants may find the material difficult. Respond calmly and without drawing attention.",points:["Remind everyone at the start that they can step out at any time.","If someone leaves, let the co-facilitator check in quietly, if the person wants that.","Offer a glass of water, a quiet space, and the support information. Ask what they need.","Do not ask why they are distressed or what happened.","If you believe someone is at immediate risk, follow the institution’s emergency procedure."],limit:"Facilitators are not counsellors. Refer to qualified support; do not attempt therapy."},{id:"disclosure",title:"Disclosure and referral boundaries",intro:"A participant may share a personal experience during or after a session.",
